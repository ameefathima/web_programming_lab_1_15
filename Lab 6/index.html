
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone | Product Catalogue</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f3ff;
            color: #252344;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #5b21b6, #2563eb);
            color: white;
            padding: 25px 8%;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            color: #e0e7ff;
        }

        /* Main section */
        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        /* Search and filter */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        input, select {
            padding: 13px;
            border: 2px solid #ddd6fe;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        input {
            width: 300px;
        }

        input:focus, select:focus {
            border-color: #7c3aed;
        }

        /* Product grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 25px;
        }

        /* Product card */
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(76, 29, 149, 0.10);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 25px rgba(76, 29, 149, 0.20);
        }

        .product-image {
            height: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 75px;
        }

        .purple { background: #ede9fe; }
        .blue { background: #dbeafe; }
        .pink { background: #fce7f3; }
        .green { background: #dcfce7; }
        .orange { background: #ffedd5; }
        .yellow { background: #fef9c3; }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .category {
            display: inline-block;
            color: #6d28d9;
            background: #ede9fe;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .price {
            color: #15803d;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn:hover {
            opacity: 0.85;
        }

        #message {
            text-align: center;
            padding: 25px;
            color: #6d28d9;
            font-size: 18px;
        }

        /* Footer */
        footer {
            margin-top: 50px;
            background: #252344;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Tablet */
        @media (max-width: 800px) {
            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* Mobile */
        @media (max-width: 500px) {
            header h1 {
                font-size: 26px;
            }

            .controls {
                flex-direction: column;
            }

            input, select {
                width: 100%;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .container {
                margin-top: 25px;
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🛍️ ShopZone</h1>
        <p>Discover your favourite products at great prices!</p>
    </header>

    <main class="container">

        <h2>Explore Our Products</h2>

        <!-- Search and Category Filter -->
        <div class="controls">
            <input
                type="text"
                id="search"
                placeholder="🔍 Search products..."
                aria-label="Search products">

            <select id="category" aria-label="Filter by category">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Accessories">Accessories</option>
            </select>
        </div>

        <!-- Products appear here -->
        <div class="product-grid" id="productGrid"></div>

        <p id="message" aria-live="polite"></p>

    </main>

    <footer>
        <p>&copy; 2026 ShopZone. All Rights Reserved.</p>
    </footer>

    <script>
        // Product data
        const products = [
            {
                name: "Wireless Headphones",
                price: 1999,
                category: "Electronics",
                icon: "🎧",
                color: "purple"
            },
            {
                name: "Smart Watch",
                price: 2499,
                category: "Electronics",
                icon: "⌚",
                color: "blue"
            },
            {
                name: "Classic T-Shirt",
                price: 599,
                category: "Clothing",
                icon: "👕",
                color: "pink"
            },
            {
                name: "Stylish Backpack",
                price: 999,
                category: "Accessories",
                icon: "🎒",
                color: "green"
            },
            {
                name: "Running Shoes",
                price: 1799,
                category: "Clothing",
                icon: "👟",
                color: "orange"
            },
            {
                name: "Sunglasses",
                price: 799,
                category: "Accessories",
                icon: "🕶️",
                color: "yellow"
            }
        ];

        const grid = document.getElementById("productGrid");
        const search = document.getElementById("search");
        const category = document.getElementById("category");
        const message = document.getElementById("message");

        // Display products
        function displayProducts(list) {
            grid.innerHTML = "";

            if (list.length === 0) {
                message.textContent = "No products found!";
                return;
            }

            message.textContent = "";

            list.forEach(function(product) {
                const card = document.createElement("div");
                card.className = "product-card";

                card.innerHTML = `
                    <div class="product-image ${product.color}">
                        ${product.icon}
                    </div>

                    <div class="product-info">
                        <h3>${product.name}</h3>

                        <span class="category">
                            ${product.category}
                        </span>

                        <p class="price">₹${product.price}</p>

                        <button class="buy-btn" type="button">
                            View Product
                        </button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Search and filter
        function filterProducts() {
            const term = search.value.toLowerCase().trim();
            const selected = category.value;

            const result = products.filter(function(product) {
                const matchesName =
                    product.name.toLowerCase().includes(term);

                const matchesCategory =
                    selected === "All" ||
                    product.category === selected;

                return matchesName && matchesCategory;
            });

            displayProducts(result);
        }

        // Respond to user input
        search.addEventListener("input", filterProducts);
        category.addEventListener("change", filterProducts);

        // Show all products when the page loads
        displayProducts(products);
    </script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f3f0ff;
            color: #252344;
            min-height: 100vh;
            padding: 40px 15px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; margin-bottom: 25px; color: #6d28d9; }
        .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }
        button {
            border: none;
            padding: 12px 16px;
            border-radius: 7px;
            background: #7c3aed;
            color: white;
            cursor: pointer;
        }
        button:hover { opacity: 0.85; }
        ul { list-style: none; }
        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 10px;
            background: #f5f3ff;
            border-radius: 7px;
        }
        li span { flex: 1; overflow-wrap: anywhere; }
        li.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .delete-btn { background: #dc2626; padding: 8px 12px; }
        #message { text-align: center; color: #777; margin-top: 15px; }
        @media (max-width: 400px) {
            .container { padding: 20px; }
            .input-area { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Enter a new task">
            <button onclick="addTask()">Add Task</button>
        </div>
        <ul id="taskList"></ul>
        <p id="message"></p>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        // Save tasks to local storage
        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        // Display tasks
        function displayTasks() {
            const list = document.getElementById("taskList");
            const message = document.getElementById("message");
            list.innerHTML = "";

            if (tasks.length === 0) {
                message.textContent = "No tasks added yet!";
                return;
            }

            message.textContent = "";

            tasks.forEach(function(task, index) {
                const li = document.createElement("li");
                if (task.completed) li.classList.add("completed");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.addEventListener("change", function() {
                    toggleTask(index);
                });

                const span = document.createElement("span");
                span.textContent = task.name;

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.className = "delete-btn";
                deleteBtn.addEventListener("click", function() {
                    deleteTask(index);
                });

                li.append(checkbox, span, deleteBtn);
                list.appendChild(li);
            });
        }

        // Add a new task
        function addTask() {
            const input = document.getElementById("taskInput");
            const name = input.value.trim();

            if (name === "") {
                alert("Please enter a task!");
                return;
            }

            tasks.push({ name: name, completed: false });
            input.value = "";
            saveTasks();
            displayTasks();
        }

        // Mark task as completed or pending
        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            displayTasks();
        }

        // Delete a task
        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            displayTasks();
        }

        // Display saved tasks when page loads
        displayTasks();
    </script>
</body>
</html>
